<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOUR7 HUB</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  font-family: 'Orbitron', sans-serif;
  color: white;
  overflow: hidden;
  background: #000;
}

/* PARTICULAS */
#particles {
  position: fixed;
  width: 100%;
  height: 100%;
  z-index: 0;
}

/* TRANSIÇÃO GLITCH */
#transition {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  z-index: 999;
  pointer-events: none;
  opacity: 0;
}

#transition.active {
  animation: glitchScreen 0.6s forwards;
}

@keyframes glitchScreen {
  0% { opacity: 0; }
  20% { opacity: 1; transform: translateX(-10px); }
  40% { transform: translateX(10px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
  100% { opacity: 1; transform: translateX(0); }
}

/* BARRAS */
.glitch-bar {
  position: absolute;
  width: 100%;
  height: 5px;
  background: #ff003c;
  animation: glitchBars 0.6s linear;
}

@keyframes glitchBars {
  from { transform: translateX(-100%); }
  to { transform: translateX(100%); }
}

/* CONTAINER */
.container {
  position: relative;
  z-index: 2;
  text-align: center;
}

h1 {
  font-size: 52px;
  margin-bottom: 60px;
}

/* CARDS */
.cards {
  display: flex;
  gap: 40px;
  justify-content: center;
}

.card {
  border: 1px solid rgba(255, 0, 80, 0.4);
  padding: 35px;
  cursor: pointer;
  width: 260px;
  background: #050505;
  transition: 0.25s;
}

.card:hover {
  transform: translateY(-8px) scale(1.04);
  box-shadow: 0 0 25px #ff003c;
}

.title {
  color: #ff003c;
  margin-bottom: 10px;
}

.desc {
  font-size: 12px;
  color: #aaa;
}

</style>
</head>

<body>

<canvas id="particles"></canvas>

<div id="transition"></div>

<div class="container">
  <h1>FOUR7 HUB</h1>

  <div class="cards">
    <div class="card" onclick="goTo('https://gusskyo.github.io/cpxsystem/')">
      <div class="title">SISTEMA</div>
      <div class="desc">Controle de metas semanais</div>
    </div>

    <div class="card" onclick="goTo('https://gusskyo.github.io/cpx-site/')">
      <div class="title">CALCULADORA</div>
      <div class="desc">Cálculo automático da lavagem</div>
    </div>
  </div>
</div>

<script>
/* TRANSIÇÃO */
function goTo(url) {
  const t = document.getElementById("transition");
  t.classList.add("active");

  // cria barras glitch
  for (let i = 0; i < 10; i++) {
    let bar = document.createElement("div");
    bar.className = "glitch-bar";
    bar.style.top = Math.random() * 100 + "%";
    bar.style.height = Math.random() * 8 + 2 + "px";
    t.appendChild(bar);
  }

  setTimeout(() => {
    window.location.href = url;
  }, 600);
}

/* PARTICULAS COM REAÇÃO */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let mouse = { x: null, y: null };

window.addEventListener("mousemove", e => {
  mouse.x = e.x;
  mouse.y = e.y;
});

let particles = [];

for (let i = 0; i < 80; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    vx: (Math.random() - 0.5) * 0.6,
    vy: (Math.random() - 0.5) * 0.6
  });
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach((p, i) => {

    let dx = mouse.x - p.x;
    let dy = mouse.y - p.y;
    let dist = Math.sqrt(dx*dx + dy*dy);

    if (dist < 120) {
      p.x -= dx * 0.01;
      p.y -= dy * 0.01;
    }

    ctx.beginPath();
    ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
    ctx.fillStyle = "#ff003c";
    ctx.fill();

    for (let j = i + 1; j < particles.length; j++) {
      let p2 = particles[j];
      let dx = p.x - p2.x;
      let dy = p.y - p2.y;
      let dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < 120) {
        ctx.strokeStyle = "rgba(255,0,60," + (1 - dist/120) + ")";
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }
    }

    p.x += p.vx;
    p.y += p.vy;

    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
  });

  requestAnimationFrame(draw);
}

draw();

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>

</body>
</html>
